<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogos de herramientas</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1a1d21;--muted:#5b6470;--accent:#0b6e8a;--line:#e2e5ea;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--card:#1e2226;--text:#f0f2f4;--muted:#a3abb5;--accent:#4cc3e0;--line:#2d343a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171a;--card:#1e2226;--text:#f0f2f4;--muted:#a3abb5;--accent:#4cc3e0;--line:#2d343a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
main{max-width:480px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 16px max(40px,env(safe-area-inset-bottom))}
.brand{text-align:center;margin-bottom:18px}
.brand img{width:120px;height:120px;border-radius:50%;display:block;margin:0 auto 10px}
.brand .neg{font-size:1.4rem;font-weight:800;margin:0}
h1{font-size:1.1rem;font-weight:600;color:var(--muted);margin:4px 0 0}
.sub{color:var(--muted);margin:0 0 20px}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
summary{list-style:none;cursor:pointer;padding:16px;font-size:1.2rem;font-weight:700;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"▾";color:var(--accent);transition:transform .2s}
details[open] summary::after{transform:rotate(180deg)}
.nota{margin:0;padding:0 16px 10px;color:var(--muted);font-size:.9rem}
.links{padding:0 12px 12px;display:grid;gap:8px}
a.item{display:block;text-decoration:none;font-weight:600;padding:13px 14px;border-radius:10px;background:var(--bg);color:var(--text);border:1px solid var(--line)}
a.item small{display:block;font-weight:400;color:var(--muted);font-size:.85rem}
a.item.todo{background:var(--accent);color:#fff;border-color:var(--accent)}
a.item.todo small{color:#e6f6fb}
.soon{padding:13px 14px;border-radius:10px;border:1px dashed var(--line);color:var(--muted)}
.contact{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center;margin-top:18px}
.contact .name{font-size:1.1rem;font-weight:700}
.contact .tel{color:var(--muted);margin:2px 0 12px}
a.wa{display:block;text-decoration:none;font-weight:700;padding:14px;border-radius:10px;background:#1fa855;color:#fff}
</style>
</head>

<script>
/* ===== AQUÍ SE CAMBIA TODO ===== */
var NEGOCIO = "Excon Ferretera"; /* nombre de tu negocio */
var NOMBRE = "Juan Ortega";
var TELEFONO = "+52 984 440 7203"; /* cambia por tu número con lada */

/* VENDEDORES: cada uno tiene su propio enlace/QR con el mismo catálogo.
   El enlace termina en ?v=clave  (ej.: .../Catalogo/?v=pedro)
   Sin clave se muestra el principal (NOMBRE y TELEFONO de arriba). */
var VENDEDORES = {
"ivonne": { "nombre": "Ivonne Lupercio", "telefono": "+52 998 220 8581" },
"raul": { "nombre": "Raúl Abascal", "telefono": "+52 998 279 5424" },
"aris": { "nombre": "Aris Duarte", "telefono": "+52 998 475 1007" }
};
(function(){
var v=(new URLSearchParams(location.search).get("v")||"").toLowerCase();
if (VENDEDORES[v]) { NOMBRE=VENDEDORES[v].nombre; TELEFONO=VENDEDORES[v].telefono; }
})();

/* Cada marca tiene "todo" (catálogo completo) y "funciones" (categorías).
   Para quitar un botón, bórralo. Para ponerlo "Próximamente", deja url:"" */
var MARCAS = [
{
"nombre": "Makita",
"nota": "Catálogos oficiales de Makita México.",
"todo": {

},

},
{

},

}
]

"todo": {

},

}

},
"funciones": []}
];
/* ================================= */

function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
var html = MARCAS.map(function(m,i){
var b = '<details'+(i===0?' open':'')+'><summary>'+esc(m.nombre)+'</summary>';
if (m.nota) b += '<p class="nota">'+esc(m.nota)+'</p>';
b += '<div class="links">';
if (m.todo && m.todo.url) b += '<a class="item todo" target="_blank" rel="noopener" href="'+esc(m.todo.url)+'">'+esc(m.todo.texto)+'<small>Catálogo completo</small></a>';
(m.funciones||[]).forEach(function(f){
b += f.url ? '<a class="item" target="_blank" rel="noopener" href="'+esc(f.url)+'">'+esc(f.texto)+'</a>' : '<div class="soon">'+esc(f.texto)+' — próximamente</div>';
});
return b + '</div></details>';
}).join("");
document.getElementById("lista").innerHTML = html;
document.getElementById("negocio").textContent = NEGOCIO;
document.getElementById("nombre").textContent = NOMBRE;
document.getElementById("tel").textContent = TELEFONO;
document.getElementById("wa").href = "https://wa.me/" + TELEFONO.replace(/\D/g,"");
